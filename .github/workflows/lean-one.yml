name: Lean ONE
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  lean-one:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          cd lean
          $HOME/.elan/bin/lean --version
      - name: Compile bridges
        run: |
          cd lean
          lean DedekindBridges.lean
      - name: Reject proof holes and custom axioms
        run: |
          if grep -R -n -E '\b(sorry|admit|axiom)\b' lean --include='*.lean'; then
            echo 'Forbidden proof hole/custom axiom found'; exit 1
          fi
